// CS2 autoexec - converted from CS:GO, 19.11.2026
// Location: <Steam Library>\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\autoexec.cfg
// Launch options: -console +exec autoexec   (CS2 also auto-runs it; running twice is harmless for this file)

echo "AUTOEXEC START"
echo "     _       _                            "
echo "  __| |_   _| | _____   __                "
echo " / _` | | | | |/ _ \ \ / /                "
echo "| (_| | |_| | |  __/\ V /                 "
echo " \__,_|\__,_|_|\___| \_/                  "
echo "                                          "
echo "  __ _ _   _| |_ ___   _____  _____  ___  "
echo " / _` | | | | __/ _ \ / _ \ \/ / _ \/ __| "
echo "| (_| | |_| | || (_) |  __/>  <  __/ (__  "
echo " \__,_|\__,_|\__\___/ \___/_/\_\___|\___|  "
echo ""

//---- KEYBINDS ----//
bind "c" "slot8"     // Smoke
bind "f" "slot7"     // Flash
bind "x" "slot6"     // HE
bind "z" "slot10"    // Molotov/Incendiary
unbind "4"

bind "F1" "buy vesthelm; buy vest"
bind "F2" "buy m4a1; buy m4a1_silencer; buy ak47"
bind "F3" "buy smokegrenade; buy flashbang; buy hegrenade; buy incgrenade; buy molotov"
bind "F4" "buy defuser"
bind "F5" "buy p250; buy flashbang"

bind "alt" "+lookatweapon"
// Drop bomb: switch to knife then C4 on press, drop on release (use weapon_* no longer works in CS2)
alias "+dropc4" "slot3; slot5"
alias "-dropc4" "drop; say_team Dropping the bomb."
bind "v" "+dropc4"
bind "capslock" "noclip"     // only works with sv_cheats 1
bind "shift" "+sprint"       // CS2 name for walk (was +speed)
bind "e" "+use"
bind "y" "messagemode"

// Custom radio panels (CS2 still has radio1-3; main comms are the radial wheels)
bind "p" "radio1"
bind "[" "radio2"
bind "]" "radio3"

bind "l" "demoui"
bind "o" "toggle spec_show_xray 0 1; play buttons/blip2"

// Zoom (.) and unzoom (,) radar - CS2 range is 0.25-1.0
bind "." "incrementvar cl_radar_scale 0.25 1.0 0.025; cl_radar_scale"
bind "," "incrementvar cl_radar_scale 0.25 1.0 -0.025; cl_radar_scale"

// q always goes to primary, or to secondary if primary is equipped
// (alias swap instead of rebinding q, so CS2 doesn't save a changed bind)
alias "qprim" "slot2; slot1; alias qtog qsec; rnd_next"
alias "qsec" "slot2; alias qtog qprim; rnd_next"
alias "qtog" "qprim"
bind "q" "qtog"
bind "1" "slot1; alias qtog qsec; rnd_next"
bind "2" "slot2; alias qtog qprim; rnd_next"
bind "3" "slot3; alias qtog qprim; rnd_next"

// Random buy (Home). The console has no random function, so this is a 12-step cycle
// that also advances every time you press q/1/2/3/tab - in practice you can't predict it.
// Each step chains the T and CT version so it buys something on either side.
alias "rwb1"  "buy ak47; buy m4a1; buy m4a1_silencer"
alias "rwb2"  "buy galilar; buy famas"
alias "rwb3"  "buy sg556; buy aug"
alias "rwb4"  "buy awp"
alias "rwb5"  "buy ssg08"
alias "rwb6"  "buy mac10; buy mp9"
alias "rwb7"  "buy mp7; buy mp5sd"
alias "rwb8"  "buy ump45"
alias "rwb9"  "buy p90"
alias "rwb10" "buy nova"
alias "rwb11" "buy sawedoff; buy mag7"
alias "rwb12" "buy deagle; buy revolver"
alias "rw1"  "alias rnd_buy rwb1;  alias rnd_next rw2"
alias "rw2"  "alias rnd_buy rwb2;  alias rnd_next rw3"
alias "rw3"  "alias rnd_buy rwb3;  alias rnd_next rw4"
alias "rw4"  "alias rnd_buy rwb4;  alias rnd_next rw5"
alias "rw5"  "alias rnd_buy rwb5;  alias rnd_next rw6"
alias "rw6"  "alias rnd_buy rwb6;  alias rnd_next rw7"
alias "rw7"  "alias rnd_buy rwb7;  alias rnd_next rw8"
alias "rw8"  "alias rnd_buy rwb8;  alias rnd_next rw9"
alias "rw9"  "alias rnd_buy rwb9;  alias rnd_next rw10"
alias "rw10" "alias rnd_buy rwb10; alias rnd_next rw11"
alias "rw11" "alias rnd_buy rwb11; alias rnd_next rw12"
alias "rw12" "alias rnd_buy rwb12; alias rnd_next rw1"
rw1
bind "home" "rnd_buy; rnd_next"

// Radar
cl_radar_always_centered "0"
cl_radar_scale "0.3"
cl_hud_radar_scale "1.3"

// Net graph (replaces cq_netgraph); ping + frametime shown only while holding tab
cl_hud_telemetry_serverrecvmargin_graph_show "1"   // 0 off, 1 only on problems, 2 always
cl_hud_telemetry_frametime_show "0"
cl_hud_telemetry_ping_show "0"
alias "+scorenet" "+showscores; cl_hud_telemetry_frametime_show 2; cl_hud_telemetry_ping_show 2; rnd_next"
alias "-scorenet" "-showscores; cl_hud_telemetry_frametime_show 0; cl_hud_telemetry_ping_show 0"
bind "tab" "+scorenet"

//---- SETTINGS ----//
cl_showloadout "1"           // inventory lower right
gameinstructor_enable "0"
cl_autohelp "1"              // "You've spotted an enemy" and others
hud_showtargetid "1"

snd_voipvolume "1"           // replaces voice_scale
cl_mute_enemy_team "0"

// Viewmodel: small, forward, down, right. CS2 ranges: x -2.5..2.5, y/z -2..2, fov 54..68
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-2"
viewmodel_fov "54"

// Bobbing: all cl_bob* / cl_viewmodel_shift_* cvars are gone in CS2, no replacement

//---- BUY BINDS ----//
// CS2: "buy X" only works if X is equipped in your loadout, so both variants are chained where needed.
// CS2 renamed numpad keys: kp_ins/end/downarrow/pgdn/leftarrow/rightarrow/home/uparrow/pgup -> kp_0..kp_9
bind "uparrow"     "buy molotov; buy incgrenade"
bind "leftarrow"   "buy smokegrenade"
bind "downarrow"   "buy flashbang"
bind "rightarrow"  "buy hegrenade"
bind "-"           "buy decoy"
bind "end"         "buy mp9; buy mac10"
bind "pgup"        "buy nova"
bind "pgdn"        "buy mag7; buy sawedoff"
bind "kp_minus"    "buy famas; buy galilar"
bind "kp_multiply" "buy defuser"
bind "kp_plus"     "buy m4a1; buy m4a1_silencer; buy ak47"
bind "kp_enter"    "buy vesthelm; buy vest"
bind "kp_del"      "buy vest"
bind "kp_0"        "buy taser"
bind "kp_1"        "buy p250"
bind "kp_2"        "buy fiveseven; buy tec9; buy cz75a"
bind "kp_3"        "buy deagle; buy revolver"
bind "kp_4"        "buy mp7; buy mp5sd"
bind "kp_5"        "buy ump45"
bind "kp_6"        "buy p90"
bind "kp_7"        "buy sg556; buy aug"
bind "kp_8"        "buy ssg08"
bind "kp_9"        "buy awp"

echo "//=====================================================//"
echo "//     Home    |    PgUp    |    PgDn    |    End     //"
echo "//   RANDOM    |    Nova    |Mag-7/Swdoff| MP9/MAC-10 //"
echo "//=====================================================//"
echo ""
echo "//=====================================================//"
echo "//     Num     |      /      |      *      |     -     //"
echo "//     Lock    |     --      |     KIT     |   FAMAS   //"
echo "//             |             |             |   GALIL   //"
echo "//-------------|-------------|-------------|-----------//"
echo "//      7      |      8      |      9      |     +     //"
echo "//  AUG/KRIEG  |    SCOUT    |     AWP     |    M4     //"
echo "//-------------|-------------|-------------|    AK47   //"
echo "//      4      |      5      |      6      |           //"
echo "//   MP7/MP5   |     UMP     |     P90     |           //"
echo "//-------------|-------------|-------------|-----------//"
echo "//      1      |      2      |      3      |   Enter   //"
echo "//    P250     | TEC9/57/CZ  |  DEAGLE/R8  |Vest+Helmet//"
echo "//-------------|-------------|-------------|           //"
echo "//      0                    |      .      |           //"
echo "//           Zeus            |     Vest    |           //"
echo "//=====================================================//"
echo ""
echo "//             |-------------|             //"
echo "//             |      /\     |             //"
echo "//             |    Molly    |             //"
echo "//-------------|-------------|-------------//"
echo "//     <-      |      \/     |      ->     //"
echo "//    Smoke    |    Flash    |      HE     //"
echo "//-------------|-------------|-------------//"
echo "//  Decoy: main-keyboard minus (-)         //"
echo ""
echo "AUTOEXEC END"

host_writeconfig
